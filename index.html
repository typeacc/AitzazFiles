<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aitzaz Files</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MAIN MENU -->
  <div class="container" id="mainMenu">
    <h1>Aitzaz Files</h1>
    <p>Aitzaz files are screenshots taken of very bad things he said in chat</p>
    <button id="viewBtn">View Files</button>
  </div>

  <!-- POPUP 1 -->
  <div class="popup" id="popup1">
    <div class="popup-box">
      <p>Are you sure you want to view the files?</p>
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <!-- POPUP 2 -->
  <div class="popup" id="popup2">
    <div class="popup-box">
      <span class="close" id="closePopup2">×</span>

      <p>Do you take responsibility for the things you're about to see?</p>
      <button>Yes</button>
      <button>No</button>

      <p>Why do you wanna view these files?</p>
      <select>
        <option>Curiosity</option>
        <option>I hate Aitzaz</option>
        <option>Idk, for fun</option>
      </select>

      <br><br>
      <button id="confirmBtn">Confirm</button>
    </div>
  </div>

  <!-- GALLERY -->
  <div id="gallery"></div>
  <p id="bottomText">more files may/may not be revealed</p>

  <!-- VIEWER -->
  <div id="viewer">
    <span class="close" id="closeViewer">×</span>
    <div class="nav left" id="prevBtn">←</div>
    <img id="viewerImg">
    <div class="nav right" id="nextBtn">→</div>
  </div>

  <!-- SCRIPT -->
  <script src="script.js?v=1"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aitzaz Files</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Aitzaz Files</h1>
    <p>Aitzaz files are screenshots taken of very bad things he said in chat</p>
    <button id="viewBtn">View Files</button>
  </div>

  <!-- Popup 1 -->
  <div class="popup hidden" id="popup1">
    <div class="popup-box">
      <p>Are you sure you want to view the files?</p>
      <button id="yesBtn">Yes</button>
      <button onclick="closePopup('popup1')">No</button>
    </div>
  </div>

  <!-- Popup 2 -->
  <div class="popup hidden" id="popup2">
    <div class="popup-box">
      <span class="close" onclick="closePopup('popup2')">×</span>

      <p>Do you take responsibility for the things you're about to see?</p>
      <button onclick="setResponsibility(true)">Yes</button>
      <button onclick="setResponsibility(false)">No</button>

      <p>Why do you wanna view these files?</p>
      <select id="reason">
        <option>Curiosity</option>
        <option>I hate Aitzaz</option>
        <option>Idk, for fun</option>
      </select>

      <button id="confirmBtn">Confirm</button>
    </div>
  </div>

  <!-- Gallery -->
  <div id="gallery" class="hidden"></div>
  <p id="bottomText" class="hidden">more files may/may not be revealed</p>

  <!-- Image Viewer -->
  <div id="viewer" class="hidden">
    <span class="close" onclick="closeViewer()">×</span>
    <button class="nav left" onclick="prevImage()">←</button>
    <img id="viewerImg">
    <button class="nav right" onclick="nextImage()">→</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
